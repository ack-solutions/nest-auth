name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/nest-auth/**'
      - 'packages/nest-auth-client/**'
      - 'packages/nest-auth-react/**'
      - 'packages/nest-auth-contracts/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (so contracts/types resolve)
        # Only the publishable libraries — NOT the example apps. The docs site
        # doesn't need them, and a stray type error in an example must never
        # block the docs deploy (it silently froze the published docs before).
        run: pnpm exec turbo run build --filter="./packages/*"

      - name: Build docs site (static export)
        run: pnpm --filter @ackplus/nest-auth-docs build
        env:
          NODE_ENV: production

      - name: Add .nojekyll
        run: touch apps/docs/out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Print deployment URL
        run: |
          echo "Deployed: ${{ steps.deployment.outputs.page_url }}"
          {
            echo "## 📚 Docs deployed"
            echo
            echo "Live at: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
